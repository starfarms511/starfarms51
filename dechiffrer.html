<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Déchiffrer une sauvegarde</title>
<style>
:root{--void:#06000D;--lime:#7CFF2E;--plasma:#B026FF;--star:#EDE6FF;--muted:rgba(237,230,255,.62);--line:rgba(237,230,255,.12);--red:#FF8A8A}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{min-height:100vh;background:radial-gradient(120% 45% at 50% -8%,#2A0A4A 0%,rgba(42,10,74,0) 62%),var(--void);color:var(--star);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto}
h1{font-size:26px;font-weight:800;color:#fff}
.lead{margin-top:8px;font-size:15px;line-height:1.5;color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;border-radius:12px;font-size:13px;color:#C9FF9E;background:rgba(124,255,46,.08);border:1px solid rgba(124,255,46,.35)}
.card{margin-top:20px;padding:18px;border-radius:20px;background:rgba(237,230,255,.04);border:1px solid var(--line)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;padding:16px;border-radius:16px;text-align:center;cursor:pointer;border:2px dashed rgba(176,38,255,.5);background:rgba(176,38,255,.07)}
.drop.has{border-style:solid;border-color:rgba(124,255,46,.55);background:rgba(124,255,46,.06)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ico{font-size:28px}
.drop .name{font-size:15px;font-weight:600;word-break:break-all}
.drop .hint{font-size:13px;color:var(--muted)}
.fld{display:block;margin-top:16px}
.fld span{display:block;margin-bottom:6px;font-size:13.5px;font-weight:600;color:rgba(237,230,255,.75)}
.fld input{width:100%;height:52px;padding:0 14px;border-radius:12px;border:1px solid rgba(237,230,255,.16);background:rgba(6,0,13,.6);color:#fff;font-size:16px;outline:none}
.fld input:focus{border-color:rgba(124,255,46,.65);box-shadow:0 0 0 3px rgba(124,255,46,.12)}
.go{width:100%;margin-top:18px;padding:16px;border:0;border-radius:16px;cursor:pointer;font-size:16px;font-weight:800;color:#0C2300;background:linear-gradient(180deg,#D9FF74 0%,#9DFF3C 46%,#52DA14 100%);box-shadow:0 5px 0 #237A05}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #237A05}
.go:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14.5px;line-height:1.45;min-height:1em}
.msg.err{color:var(--red)}
.msg.ok{color:#C9FF9E}
.out{margin-top:20px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:16px;text-decoration:none;font-size:15.5px;font-weight:700;color:var(--star);background:rgba(176,38,255,.14);border:1px solid rgba(176,38,255,.5)}
.meta{margin:14px 2px 8px;font-size:13px;color:var(--muted)}
.table-wrap{overflow:auto;max-height:60vh;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:9px 11px;text-align:left;white-space:nowrap;border-bottom:1px solid rgba(237,230,255,.08)}
th{position:sticky;top:0;background:#1A0B30;color:#fff;font-weight:700}
td{color:rgba(237,230,255,.85)}
tr:nth-child(even) td{background:rgba(237,230,255,.025)}
</style>
</head>
<body>
<main>
  <h1>Déchiffrer une sauvegarde</h1>
  <p class="lead">Ouvre un fichier <b>.sf51</b> reçu par email avec ton mot de passe de sauvegarde.</p>
  <div class="lock">🔒 Tout se passe sur ton appareil : rien n'est envoyé sur Internet.</div>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".sf51,application/octet-stream">
      <span class="ico">📄</span>
      <span class="name" id="fname">Choisir un fichier .sf51</span>
      <span class="hint" id="fhint">Pièce jointe de l'email de sauvegarde</span>
    </label>
    <label class="fld"><span>Mot de passe de sauvegarde</span><input type="password" id="pwd" autocomplete="current-password"></label>
    <button class="go" id="go" type="button">Déchiffrer</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>

  <section class="out" id="out" hidden>
    <a class="dl" id="dl">⬇️ Télécharger le fichier Excel</a>
    <p class="meta" id="meta"></p>
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>
</main>
<script>
(function () {
  var MAGIC = "SF51BK1";
  var fileEl = document.getElementById("file"), pwdEl = document.getElementById("pwd"), goEl = document.getElementById("go");
  var msgEl = document.getElementById("msg"), outEl = document.getElementById("out"), dlEl = document.getElementById("dl");
  var lastUrl = null;

  function say(t, kind) { msgEl.textContent = t; msgEl.className = "msg" + (kind ? " " + kind : ""); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; }); }

  fileEl.addEventListener("change", function () {
    var f = fileEl.files[0];
    document.getElementById("fname").textContent = f ? f.name : "Choisir un fichier .sf51";
    document.getElementById("fhint").textContent = f ? "Fichier sélectionné" : "Pièce jointe de l'email de sauvegarde";
    document.getElementById("drop").classList.toggle("has", !!f);
    say(""); outEl.hidden = true;
  });
  pwdEl.addEventListener("keydown", function (e) { if (e.key === "Enter") goEl.click(); });

  async function decrypt(buf, password) {
    var u = new Uint8Array(buf);
    if (u.length < 7 + 4 + 16 + 12 + 16) throw new Error("format");
    for (var i = 0; i < 7; i++) if (u[i] !== MAGIC.charCodeAt(i)) throw new Error("format");
    var iter = new DataView(buf, 7, 4).getUint32(0);
    var salt = u.slice(11, 27), iv = u.slice(27, 39), data = u.slice(39);
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data));
  }

  function parseCsv(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ";") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== "\r") cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  goEl.addEventListener("click", async function () {
    var f = fileEl.files[0], pwd = pwdEl.value;
    if (!f) { say("Choisis d'abord un fichier .sf51.", "err"); return; }
    if (!pwd) { say("Saisis ton mot de passe de sauvegarde.", "err"); pwdEl.focus(); return; }
    if (!window.crypto || !crypto.subtle) { say("Ce navigateur ne permet pas le déchiffrement. Ouvre cette page en https avec un navigateur récent.", "err"); return; }
    goEl.disabled = true; goEl.textContent = "Déchiffrement…"; say(""); outEl.hidden = true;
    try {
      var bytes = await decrypt(await f.arrayBuffer(), pwd);
      var text = new TextDecoder("utf-8").decode(bytes);
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(new Blob([bytes], { type: "text/csv;charset=utf-8" }));
      dlEl.href = lastUrl; dlEl.download = f.name.replace(/\.sf51$/i, "") || "sauvegarde.csv";
      var rows = parseCsv(text), head = rows.shift() || [], shown = rows.slice(0, 100);
      document.getElementById("tbl").innerHTML =
        "<thead><tr>" + head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        shown.map(function (r) { return "<tr>" + head.map(function (_, k) { return "<td>" + esc(r[k] || "") + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
      document.getElementById("meta").textContent = rows.length + " ligne" + (rows.length > 1 ? "s" : "") + (rows.length > shown.length ? " · aperçu des 100 premières" : "");
      outEl.hidden = false;
      say("✓ Fichier déchiffré.", "ok");
      pwdEl.value = "";
    } catch (e) {
      say(e && e.message === "format" ? "Ce fichier n'est pas une sauvegarde .sf51 valide." : "Mot de passe incorrect ou fichier abîmé.", "err");
    } finally {
      goEl.disabled = false; goEl.textContent = "Déchiffrer";
    }
  });
})();
</script>
</body>
</html>
